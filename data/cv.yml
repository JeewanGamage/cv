  residency: "Canadian permanent resident; citizen of Sri Lanka"
  language: "English (full professional proficiency); Sinhala (native)"
  tagline: "Soil biogeochemist integrating isotope tracing, molecular soil organic matter chemistry and managed grasslands"
  profile_academic: >
    I am a soil biogeochemist whose research has progressed from crop nitrogen use efficiency in Sri Lanka to molecular
    soil organic matter (SOM) chemistry, managed grassland soil health and plant-soil carbon cycling in Canada. Across
    this work I pursue one central question: what determines whether soils retain or release carbon and nitrogen?
    I combine ¹³CO₂ pulse-chase labelling, POM/MAOM fractionation, solid-state and solution-state ¹³C NMR, DRIFTS/FTIR
    and NEXAFS spectroscopy with field and controlled-environment experiments to trace plant-derived carbon and
    resolve how organic matter is transformed, stabilised or mobilised.
  profile_industry: >
    Soil scientist and project lead with 10 or more years of experience across research, teaching and leadership.
    I design and deliver multi-season field and laboratory programs, turn complex analytical data into decisions for
    producers and funders, and lead teams and negotiations. Technical strengths in soil carbon measurement (¹³C
    isotope tracing, fractionation, NMR and infrared spectroscopy), experimental design, R/SAS/Python analytics and
    stakeholder-facing reporting, backed by an MBA and CIMA training in strategy, budgeting and governance.

